name: Release DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to upload unsigned prerelease DMGs to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - id: arm64
            label: apple-silicon
            triple: arm64-apple-macosx14.0
          - id: x86_64
            label: intel
            triple: x86_64-apple-macosx14.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          if [[ -z "${XCODE_APP:-}" ]]; then
            echo "No Xcode installation found under /Applications" >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Validate release secrets
        if: github.event_name == 'release' && github.event.release.prerelease == false
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        if: github.event_name == 'release' && github.event.release.prerelease == false
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/maxcli-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/maxcli-cert.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true)"
          echo "$IDENTITIES"
          if ! grep -q "Developer ID Application" <<<"$IDENTITIES"; then
            echo "No Developer ID Application identity found." >&2
            exit 1
          fi
          if ! grep -q "($APPLE_TEAM_ID)" <<<"$IDENTITIES"; then
            echo "No Developer ID Application identity matches APPLE_TEAM_ID=$APPLE_TEAM_ID." >&2
            exit 1
          fi

      - name: Configure notarytool profile
        if: github.event_name == 'release' && github.event.release.prerelease == false
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          xcrun notarytool store-credentials "AC_NOTARY" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"

      - name: Resolve release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          APP_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - Packaging/Info.plist)"
          BUILD_VERSION="$(plutil -extract CFBundleVersion raw -o - Packaging/Info.plist)"
          TAG_VERSION="${RELEASE_TAG#v}"
          TAG_VERSION="${TAG_VERSION#V}"
          if [[ -n "$TAG_VERSION" && "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "Release tag $TAG_VERSION does not match CFBundleShortVersionString $APP_VERSION." >&2
            exit 1
          fi
          RELEASE_VERSION="${TAG_VERSION:-$APP_VERSION}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Build and package DMG
        shell: bash
        env:
          APP_VERSION: ${{ env.RELEASE_VERSION }}
          APP_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          BUILD_TRIPLE: ${{ matrix.arch.triple }}
          ARCH_LABEL: ${{ matrix.arch.label }}
          CODESIGN_IDENTITY: ${{ github.event_name == 'release' && github.event.release.prerelease == false && 'Developer ID Application' || '-' }}
          NOTARIZE: ${{ github.event_name == 'release' && github.event.release.prerelease == false && '1' || '0' }}
          NOTARY_PROFILE: AC_NOTARY
        run: |
          set -euo pipefail
          chmod +x scripts/build-app.sh scripts/build_release_dmg.sh
          scripts/build_release_dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxcli-${{ matrix.arch.label }}
          path: dist/*.dmg

      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.dmg --clobber

  publish-sparkle-appcast:
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: build-dmg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Sparkle appcast assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          RELEASE_NAME="$(jq -r '.name // ""' <<<"$RELEASE_JSON")"
          RELEASE_NOTES="$(jq -r '.body // ""' <<<"$RELEASE_JSON")"
          PUBLISHED_AT="$(jq -r '.published_at // ""' <<<"$RELEASE_JSON")"
          ARM64_URL="$(jq -r '.assets[] | select(.name | test("apple-silicon.*\\.dmg$")) | .browser_download_url' <<<"$RELEASE_JSON" | head -n 1)"
          ARM64_SIZE="$(jq -r '.assets[] | select(.name | test("apple-silicon.*\\.dmg$")) | .size' <<<"$RELEASE_JSON" | head -n 1)"
          X86_64_URL="$(jq -r '.assets[] | select(.name | test("intel.*\\.dmg$")) | .browser_download_url' <<<"$RELEASE_JSON" | head -n 1)"
          X86_64_SIZE="$(jq -r '.assets[] | select(.name | test("intel.*\\.dmg$")) | .size' <<<"$RELEASE_JSON" | head -n 1)"
          BUILD_VERSION="$(awk '/<key>CFBundleVersion<\/key>/ { getline; gsub(/^[[:space:]]*<string>|<\/string>[[:space:]]*$/, ""); print; exit }' Packaging/Info.plist)"
          BUILD_VERSION="${BUILD_VERSION:-1}"

          if [[ -z "$ARM64_URL" || -z "$X86_64_URL" ]]; then
            echo "Unable to locate both architecture DMGs in release $RELEASE_TAG." >&2
            exit 1
          fi

          chmod +x scripts/generate_sparkle_appcast.sh
          OUTPUT_DIR=dist \
          RELEASE_TAG="$RELEASE_TAG" \
          RELEASE_NAME="$RELEASE_NAME" \
          RELEASE_NOTES="$RELEASE_NOTES" \
          BUILD_VERSION="$BUILD_VERSION" \
          PUBLISHED_AT="$PUBLISHED_AT" \
          ARM64_URL="$ARM64_URL" \
          ARM64_SIZE="$ARM64_SIZE" \
          X86_64_URL="$X86_64_URL" \
          X86_64_SIZE="$X86_64_SIZE" \
          scripts/generate_sparkle_appcast.sh

          for appcast in dist/appcast-arm64.xml dist/appcast-x86_64.xml; do
            rg -q '<enclosure' "$appcast"
            rg -q 'sparkle:version=' "$appcast"
            rg -q '^ *url="https://' "$appcast"
          done

      - name: Attach Sparkle appcasts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/appcast-*.xml --clobber
